# Mantém atualizados os SHAs das Actions e o digest da imagem base, que estão
# fixados (ci.yml, Dockerfile).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Só LTS: a troca de versão maior do Node é manual (o Dependabot levou a
    # imagem para o 25, que não é LTS). Patches e digests continuam automáticos.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
